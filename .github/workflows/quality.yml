name: Android Lint & Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint (Debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests (Debug)
        # Screenshot (Roborazzi) testleri ayrı "visual-preview" job'unda record/verify edilir;
        # burada record modunda çalıştırıp golden'a bağımlı verify hatasını engelliyoruz.
        run: ./gradlew testDebugUnitTest -Proborazzi.record=true --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
