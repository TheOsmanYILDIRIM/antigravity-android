name: Build & Release Antigravity AI APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (ARM64-v8a Signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AntigravityAI-arm64-v8a.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAI-APK
          path: build-output/AntigravityAI-arm64-v8a.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "Antigravity AI Mobile App v1.3.0 (Sabit İmzalı)"
          body: |
            ### ⚡ Antigravity AI - Jetpack Compose Native Mobile App (v1.3.0)
            
            Android (ARM64-v8a) için optimize edilmiş ve **sabit kalıcı Release Keystore** ile imzalanmış yerel mobil asistan uygulaması.
            
            #### 🚀 Bu Sürümdeki Geliştirmeler:
            - **Sabit İmzalı Güncelleme Desteği:** Artık tüm APK'lar aynı kalıcı anahtarla imzalanır; eski sürümü silmeden doğrudan üstüne güncelleyebilirsiniz.
            - **Doğrudan CLI Telemetri & Token Göstergesi:** Gerçek 5 saatlik ve haftalık token tüketimi, dönüş sayıları ve son istek ayrıntıları doğrudan Antigravity CLI transcriptlerinden okunur.
            - **Dinamik Model & Düşünme Ağırlığı:** CLI ortamındaki modeller ve `--effort` parametreleri dinamik olarak yapılandırılır.
            - **Görsel Önizleme & Yerel Çalışma Alanı Yüklemesi:** Kullanıcı görselleri Coil ile chat içinde önizlenir ve Termux ortamına aktarılarak Gemini Vision ile doğrudan analiz edilir.
            - **Çoklu Yapıştırma Çipleri:** Birden çok kopyalanan metin bağımsız çipler olarak saklanır.
            - **Obsidian-Tarzı AGY Vault Kütüphanesi:** Not oluşturma, düzenleme, klasör açma ve satır/paragraf alıntılama özellikleri.
          files: build-output/AntigravityAI-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
