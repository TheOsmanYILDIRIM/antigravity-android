name: Build & Release Antigravity AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (ARM64-v8a Signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AntigravityAI-arm64-v8a.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAI-APK
          path: build-output/AntigravityAI-arm64-v8a.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "Antigravity AI Mobile App v1.4.0 (Official Gemini UI Redesign)"
          body: |
            ### ⚡ Antigravity AI - Jetpack Compose Native Mobile App (v1.4.0)
            
            Android (ARM64-v8a) için optimize edilmiş ve **Figma Gemini UI Screens** tasarımı baz alınarak baştan sona yeniden tasarlanmış yerel mobil asistan uygulaması.
            
            #### 🎨 Figma Gemini UI Tasarım Yenilikleri:
            - **'Hello, Osman' Karşılama Ekranı:** Canlı Gemini Sparkle (✦) gradyan ikonu, yatay kaydırılabilir öneri kartları (`Help me`, `Explore`, `Analyze`, `Plan`) ve hızlı yetenek çipi.
            - **Modern Mesaj Balonları & Aksiyonlar:** Beğen 👍, Beğenme 👎, Paylaş ↗, Panoya Kopyala 📋 aksiyon araç çubuğu ve token telemetrisi.
            - **Sleek Input Dock:** Yuvarlatılmış `#1E1F20` hap input barı, `+` dosya/resim ekleme, model hızlı geçiş hapı (`Gemini 3.7 Flash ⚡`), sesli yazma ve gönderme butonu.
            - **Figma Gemini Yan Çekmece:** `Search for chats` arama barı, `New Chat` aksiyonu, `My Stuff (Vault)` ve aktif konuşma vurgusu.
            - **Sabit İmzalı Kalıcı Keystore:** Üst üste güncelleme garantisi.
          files: build-output/AntigravityAI-arm64-v8a.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
