name: SonarCloud Analysis

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    # SONAR_TOKEN repo Secrets'e eklenince otomatik devreye girer; yoksa atlanır.
    # Ayrıca repo/organizasyon ayarlarında üçüncü taraf action'lara izin verilmeli:
    #   SonarSource/sonarcloud-github-action
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout (full history for SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint (SonarCloud import için rapor üret)
        run: ./gradlew lintDebug --stacktrace

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
