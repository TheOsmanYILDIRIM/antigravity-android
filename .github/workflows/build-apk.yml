name: Build & Release Antigravity AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (ARM64-v8a Signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AntigravityAI-arm64-v8a.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAI-APK
          path: build-output/AntigravityAI-arm64-v8a.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: "Antigravity AI Mobile App v1.4.1 (Clone Edition - Çakışmasız Yan Yana Kurulum)"
          body: |
            ### ⚡ Antigravity AI - Jetpack Compose Native Mobile App (v1.4.1 Clone Edition)
            
            Ana Antigravity uygulaması veya diğer sürümlerle çakışmadan aynı Android cihazda **yan yana bağımsız olarak kurulabilmesi** için `com.antigravity.ai.clone` paket kimliği ile derlenen sürüm.
            
            #### 🚀 Yenilikler & Düzeltmeler:
            - **Klon / Yan Yana Kurulum (Side-by-side Install):** `applicationId = "com.antigravity.ai.clone"` ve bağımsız paket kimliği.
            - **Sabit İmzalı Kalıcı Keystore:** Üst üste güncelleme garantisi.
            - **Figma Gemini UI Redesign:** Sparkle karşılama ekranı, sleek input dock, model seçimi, çift arka uç (AGY + OpenCode) desteği.
          files: build-output/AntigravityAI-arm64-v8a.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
