# SonarCloud yapılandırması (Antigravity Android)
# NOT: GitHub repo Secrets içine SONAR_TOKEN eklenmelidir.
# SonarCloud'da proje import edilip aşağıdaki key/org ile eşleşmelidir.

sonar.projectKey=TheOsmanYILDIRIM_antigravity-android
sonar.organization=theosmanyildirim
sonar.projectName=Antigravity Android

sonar.language=kotlin
sonar.sources=app/src/main
sonar.tests=app/src/test,app/src/androidTest

# Android Lint sonuçlarını içe aktar
sonar.android.lint.report=app/build/reports/lint-results-debug.xml

# JUnit (semantik UI) test sonuçları
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest

# Jacoco coverage (opsiyonel, rapor varsa içe aktarılır)
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

sonar.sourceEncoding=UTF-8
