name: Android Lint & Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint (Debug)
        run: ./gradlew lintDebug --stacktrace

      - name: Run Compose UI Semantic Tests (Debug)
        # Roborazzi piksel testleri kaldırıldı; yerine deterministik semantik UI
        # testleri (UiSemanticsTest) çalışır — golden görsele bağımlı değildir.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud Static & UI Code Analysis
    runs-on: ubuntu-latest
    # SONAR_TOKEN repo Secrets'e eklenince otomatik devreye girer; yoksa atlanır.
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout (full history for SonarCloud)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint (SonarCloud import için rapor üret)
        run: ./gradlew lintDebug --stacktrace

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
