name: Build & Release Antigravity AI APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK (ARM64-v8a)
        run: ./gradlew assembleDebug --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AntigravityAI-arm64-v8a.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAI-APK
          path: build-output/AntigravityAI-arm64-v8a.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Antigravity AI Mobile App v1.0.0"
          body: |
            ### ⚡ Antigravity AI - Jetpack Compose Native Mobile App
            
            Android (ARM64-v8a) için optimize edilmiş yerel mobil asistan uygulaması.
            
            #### 🚀 Özellikler:
            - **Jetpack Compose & Material 3:** Modern, karanlık AI neon teması.
            - **Canlı Araç Çağrısı Kartları (Tool Cards):** Terminal komutları, dosya işlemleri ve arama eylemleri için açılır-kapanır görsel kartlar.
            - **Çoklu Sohbet Yönetimi (Side Drawer):** Sohbetleri ayrı ayrı görebilme, geçmiş sohbetlere erişim ve yeni sohbet başlatma.
            - **Sesle Yazma (Speech-to-Text):** Dahili mikrofon desteği ile hızlı sesli komut girişi.
            - **Termux & Yerel Daemon Köprüsü:** Arka planda çalışan `agy` oturumu ile canlı SSE senkronizasyonu.
            - **Kalıcı Durum:** Uygulama veya ekran kapansa bile arka planda devam eden işlemler.
          files: build-output/AntigravityAI-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
