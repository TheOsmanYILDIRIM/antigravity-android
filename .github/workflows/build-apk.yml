name: Build & Release Antigravity AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK (ARM64-v8a Signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AntigravityAI-arm64-v8a.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityAI-APK
          path: build-output/AntigravityAI-arm64-v8a.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "Antigravity AI Mobile App v1.3.1 (Sabit İmzalı)"
          body: |
            ### ⚡ Antigravity AI - Jetpack Compose Native Mobile App (v1.3.1)
            
            Android (ARM64-v8a) için optimize edilmiş ve **sabit kalıcı Release Keystore** ile imzalanmış yerel mobil asistan uygulaması.
            
            #### 🚀 Bu Sürümdeki Geliştirmeler:
            - **Sabit İmzalı Güncelleme Desteği:** Artık tüm APK'lar aynı kalıcı anahtarla imzalanır; eski sürümü silmeden doğrudan üstüne güncelleyebilirsiniz.
            - **Birebir CLI Model Listesi (14 Model):** `agy models` çıktısı (`Gemini 3.7 Flash High/Medium/Low`, `Gemini 3.6 Flash`, `Gemini 3.5 Flash`, `Gemini 3.1 Pro`, `Claude Sonnet 4.6 Thinking`, `Claude Opus 4.6`, `GPT-OSS 120B`) dinamik olarak çekilir ve sunulur.
            - **Kalan Kota Yüzdesi (% Kalan):** 5 saatlik ve haftalık pencerelerdeki net kalan yüzdeler ve token tüketimleri anlık olarak hesaplanıp gösterilir.
            - **Görsel Önizleme & Yerel Çalışma Alanı Yüklemesi:** Kullanıcı görselleri Coil ile chat içinde önizlenir ve Termux ortamına aktarılarak Gemini Vision ile doğrudan analiz edilir.
            - **Çoklu Yapıştırma Çipleri & Vault Kütüphanesi:** Birden çok kopyalanan metin bağımsız çipler olarak saklanır.
          files: build-output/AntigravityAI-arm64-v8a.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
