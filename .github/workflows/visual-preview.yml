name: Compose UI Visual Preview (Roborazzi)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native render libraries (Roborazzi)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6 fontconfig fonts-noto-color-emoji || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Render Jetpack Compose Screens to PNG (Headless Roborazzi)
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: List Generated Screenshots
        run: |
          mkdir -p roborazzi-output
          find app/build/outputs/roborazzi/ -name "*.png" -exec cp {} roborazzi-output/ \;
          ls -la roborazzi-output/

      - name: Upload Visual Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview-screenshots
          path: roborazzi-output/*.png
          if-no-files-found: warn
